[package]
name = "strata"
version = "1.0.0"
description = "Strata - blazing fast disk space analyzer for Windows"
authors = ["Kasempiternal"]
license = "MIT"
repository = "https://github.com/Kasempiternal/strata"
homepage = "https://kasempiternal.github.io/strata/"
readme = "../README.md"
keywords = ["disk", "ntfs", "mft", "storage", "tauri"]
edition = "2021"
rust-version = "1.88"
resolver = "3"

[lib]
name = "strata_engine"
path = "src/lib.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
tempfile = "3"

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1"
trash = "5"
rfd = "0.17"

[dependencies.windows-sys]
version = "0.61"
features = [
  "Win32_Foundation",
  "Win32_Storage_FileSystem",
  "Win32_System_IO",
  "Win32_System_Ioctl",
  "Win32_Security",
  "Win32_System_Threading",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.dev.package."*"]
opt-level = 2
